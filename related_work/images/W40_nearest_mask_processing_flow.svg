<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">AnomalyCLIP nearest mask 처리와 평가 흐름</title>
  <desc id="desc">원본 VisA 이미지와 정답 mask가 각각 이미지 전처리와 두 종류 mask 전처리를 거쳐 같은 anomaly map으로 Pixel AUROC를 계산하는 흐름도</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#34495e"/></marker>
    <style>
      text { font-family: 'Malgun Gothic', 'Noto Sans KR', Arial, sans-serif; fill: #1f2933; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .box { stroke: #34495e; stroke-width: 2; rx: 12; }
      .arrow { stroke: #34495e; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="60" y="62" class="title">W40 · nearest mask 처리: 파일 → 모델 → 평가 흐름</text>
  <text x="60" y="94" class="small">목적: 모델의 anomaly map은 고정하고, 정답 mask의 공간 변환만 바꿔 Pixel AUROC 변화가 평가 좌표계에서 왔는지 확인</text>

  <!-- Source files -->
  <text x="66" y="172" class="section">1. 원본 파일</text>
  <rect x="65" y="200" width="255" height="135" class="box" fill="#e8f1fb"/>
  <text x="192" y="247" class="label" text-anchor="middle">VisA 원본 RGB 이미지</text>
  <text x="192" y="277" class="small" text-anchor="middle">예: candle 1284 × 1168</text>
  <text x="192" y="306" class="tiny" text-anchor="middle">Data/Images/…/*.JPG</text>
  <rect x="65" y="500" width="255" height="135" class="box" fill="#fef3c7"/>
  <text x="192" y="547" class="label" text-anchor="middle">정답 결함 mask</text>
  <text x="192" y="577" class="small" text-anchor="middle">배경 0 / 결함 1</text>
  <text x="192" y="606" class="tiny" text-anchor="middle">Data/Masks/…/*.png</text>

  <!-- image branch -->
  <text x="410" y="172" class="section">2. 고정된 모델 입력 경로</text>
  <rect x="405" y="200" width="290" height="135" class="box" fill="#dbeafe"/>
  <text x="550" y="241" class="label" text-anchor="middle">공식 image 전처리</text>
  <text x="550" y="273" class="small" text-anchor="middle">shortest-edge Resize(518)</text>
  <text x="550" y="300" class="small" text-anchor="middle">→ CenterCrop(518) → Normalize</text>
  <rect x="790" y="200" width="260" height="135" class="box" fill="#c7e8f3"/>
  <text x="920" y="241" class="label" text-anchor="middle">AnomalyCLIP</text>
  <text x="920" y="272" class="small" text-anchor="middle">image/text similarity</text>
  <text x="920" y="300" class="small" text-anchor="middle">patch similarity map</text>
  <rect x="1145" y="185" width="275" height="165" class="box" fill="#d1fae5"/>
  <text x="1282" y="228" class="label" text-anchor="middle">모델 출력</text>
  <text x="1282" y="260" class="small" text-anchor="middle">Image anomaly score</text>
  <text x="1282" y="289" class="small" text-anchor="middle">Anomaly map [518 × 518]</text>
  <text x="1282" y="319" class="tiny" text-anchor="middle">두 mask 조건에서 동일하게 고정</text>

  <path d="M320 267 L405 267" class="arrow"/>
  <path d="M695 267 L790 267" class="arrow"/>
  <path d="M1050 267 L1145 267" class="arrow"/>

  <!-- Mask branches -->
  <text x="410" y="454" class="section">3. 정답 mask 처리: 공간 변환만 비교</text>
  <rect x="405" y="500" width="300" height="135" class="box" fill="#dcfce7"/>
  <text x="555" y="536" class="label" text-anchor="middle">공식 mask 조건</text>
  <text x="555" y="567" class="small" text-anchor="middle">Resize(short edge=518, nearest)</text>
  <text x="555" y="594" class="small" text-anchor="middle">→ CenterCrop(518)</text>
  <rect x="405" y="705" width="300" height="135" class="box" fill="#ffedd5"/>
  <text x="555" y="746" class="label" text-anchor="middle">공통 mask 조건</text>
  <text x="555" y="777" class="small" text-anchor="middle">Resize((518, 518), nearest)</text>
  <text x="555" y="804" class="tiny" text-anchor="middle">종횡비를 유지하지 않는 정사각형 변환</text>
  <path d="M320 567 L405 567" class="arrow"/>
  <path d="M320 567 L365 567 L365 772 L405 772" class="arrow"/>

  <!-- evaluation -->
  <rect x="840" y="500" width="280" height="135" class="box" fill="#ecfccb"/>
  <text x="980" y="541" class="label" text-anchor="middle">공식 Pixel AUROC</text>
  <text x="980" y="572" class="small" text-anchor="middle">동일 anomaly map</text>
  <text x="980" y="600" class="small" text-anchor="middle">vs 공식 mask</text>
  <rect x="840" y="705" width="280" height="135" class="box" fill="#fef3c7"/>
  <text x="980" y="746" class="label" text-anchor="middle">공통 Pixel AUROC</text>
  <text x="980" y="777" class="small" text-anchor="middle">동일 anomaly map</text>
  <text x="980" y="805" class="small" text-anchor="middle">vs 공통 mask</text>
  <path d="M705 567 L840 567" class="arrow"/>
  <path d="M705 772 L840 772" class="arrow"/>
  <path d="M1282 350 L1282 430 L760 430 L760 567 L840 567" class="arrow"/>
  <path d="M1282 350 L1282 430 L760 430 L760 772 L840 772" class="arrow"/>

  <rect x="1235" y="585" width="275" height="165" class="box" fill="#f3e8ff"/>
  <text x="1372" y="628" class="label" text-anchor="middle">비교 결과</text>
  <text x="1372" y="660" class="small" text-anchor="middle">Δ Pixel AUROC</text>
  <text x="1372" y="690" class="small" text-anchor="middle">Δ mask 픽셀 비율</text>
  <text x="1372" y="720" class="tiny" text-anchor="middle">모델 성능 차이가 아닌</text>
  <text x="1372" y="739" class="tiny" text-anchor="middle">평가 좌표계 영향인지 해석</text>
  <path d="M1120 567 L1180 567 L1180 650 L1235 650" class="arrow"/>
  <path d="M1120 772 L1180 772 L1180 690 L1235 690" class="arrow"/>

  <!-- Legend -->
  <rect x="66" y="870" width="1430" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="94" y="889" width="22" height="22" fill="#dbeafe" stroke="#34495e"/><text x="126" y="907" class="small">파랑: image / model 경로</text>
  <rect x="374" y="889" width="22" height="22" fill="#dcfce7" stroke="#34495e"/><text x="406" y="907" class="small">초록: 공식 mask 경로</text>
  <rect x="664" y="889" width="22" height="22" fill="#ffedd5" stroke="#34495e"/><text x="696" y="907" class="small">주황: 공통 mask 경로</text>
  <rect x="952" y="889" width="22" height="22" fill="#d1fae5" stroke="#34495e"/><text x="984" y="907" class="small">청록: 동일 모델 출력</text>
  <rect x="1212" y="889" width="22" height="22" fill="#f3e8ff" stroke="#34495e"/><text x="1244" y="907" class="small">보라: 비교 지표</text>
</svg>
