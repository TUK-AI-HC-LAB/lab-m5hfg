<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">공통 이상 탐지 코드베이스 전체 흐름</title>
  <desc id="desc">YAML 설정에서 시작해 registry, dataset, trainer, method별 점수 계산, 공통 평가와 CSV 결과 저장으로 이어지는 이상 탐지 프레임워크 구조</desc>
  <defs>
    <style>
      .title{font-family:'Malgun Gothic',Arial,sans-serif;font-weight:700;fill:#18212b}.h{font-family:'Malgun Gothic',Arial,sans-serif;font-weight:700;fill:#172033}.t{font-family:'Malgun Gothic',Arial,sans-serif;fill:#172033}.small{font-family:'Malgun Gothic',Arial,sans-serif;fill:#334155}.mono{font-family:Consolas,'Courier New',monospace;fill:#172033}.box{stroke:#233247;stroke-width:2;rx:16;ry:16}.thin{stroke:#34495e;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.group{stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6;rx:22;ry:22}.label{font-family:'Malgun Gothic',Arial,sans-serif;font-weight:700;font-size:17px;fill:#fff}.tag{font-family:'Malgun Gothic',Arial,sans-serif;font-size:15px;fill:#334155}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1600" height="1020" fill="#ffffff"/>
  <text x="800" y="55" text-anchor="middle" class="title" font-size="31">W40 · 공통 이상 탐지 코드베이스의 압축된 실행 흐름</text>
  <text x="800" y="84" text-anchor="middle" class="small" font-size="17">상자 = 파일·데이터·중간 상태 / 얇은 화살표 = 함수 호출·데이터 전달</text>

  <!-- flow groups -->
  <rect x="42" y="125" width="272" height="610" class="group" fill="#eef6ff"/>
  <text x="178" y="157" text-anchor="middle" class="h" font-size="20">1. 설정과 실행 시작</text>
  <rect x="73" y="190" width="210" height="112" class="box" fill="#bfe1fa"/>
  <text x="178" y="226" text-anchor="middle" class="mono" font-size="20">experiment.yaml</text>
  <text x="178" y="254" text-anchor="middle" class="small" font-size="16">method · dataset · seed</text>
  <text x="178" y="278" text-anchor="middle" class="small" font-size="16">data_path · 실행 옵션</text>
  <path d="M178 302 L178 355" class="thin"/>
  <rect x="73" y="365" width="210" height="104" class="box" fill="#bfe1fa"/>
  <text x="178" y="406" text-anchor="middle" class="mono" font-size="22">main.py</text>
  <text x="178" y="435" text-anchor="middle" class="small" font-size="16">설정 병합 · 실행 시작</text>
  <path d="M178 469 L178 522" class="thin"/>
  <rect x="73" y="532" width="210" height="130" class="box" fill="#dbeafe"/>
  <text x="178" y="569" text-anchor="middle" class="mono" font-size="17">component_registry.py</text>
  <text x="178" y="599" text-anchor="middle" class="small" font-size="16">이름 → 실제 class</text>
  <text x="178" y="625" text-anchor="middle" class="small" font-size="16">method / dataset 선택</text>

  <rect x="351" y="125" width="430" height="610" class="group" fill="#f0fdf4"/>
  <text x="566" y="157" text-anchor="middle" class="h" font-size="20">2. 공통 데이터 계약</text>
  <rect x="388" y="190" width="342" height="100" class="box" fill="#c7f0d8"/>
  <text x="559" y="228" text-anchor="middle" class="mono" font-size="20">main_dataset.py</text>
  <text x="559" y="257" text-anchor="middle" class="small" font-size="16">선택된 Dataset 생성</text>
  <path d="M283 595 C330 595,340 240,388 240" class="thin"/>
  <path d="M559 290 L559 342" class="thin"/>
  <rect x="388" y="352" width="342" height="122" class="box" fill="#dcfce7"/>
  <text x="559" y="386" text-anchor="middle" class="t" font-size="20" font-weight="700">파일 → 전처리</text>
  <text x="559" y="417" text-anchor="middle" class="small" font-size="16">image / mask / label / path 읽기</text>
  <text x="559" y="443" text-anchor="middle" class="small" font-size="16">resize · tensor · normalize</text>
  <path d="M559 474 L559 527" class="thin"/>
  <rect x="388" y="537" width="342" height="132" class="box" fill="#bbf7d0"/>
  <text x="559" y="572" text-anchor="middle" class="t" font-size="19" font-weight="700">DataLoader 공통 batch</text>
  <text x="559" y="604" text-anchor="middle" class="mono" font-size="16">{image, mask, is_anomaly, path}</text>
  <text x="559" y="632" text-anchor="middle" class="small" font-size="15">모든 method가 같은 입력 형식을 받음</text>

  <rect x="819" y="125" width="405" height="610" class="group" fill="#faf5ff"/>
  <text x="1021" y="157" text-anchor="middle" class="h" font-size="20">3. 공통 실행 · 방법별 판단</text>
  <rect x="858" y="190" width="326" height="98" class="box" fill="#e9d5ff"/>
  <text x="1021" y="226" text-anchor="middle" class="mono" font-size="20">main_net.py</text>
  <text x="1021" y="255" text-anchor="middle" class="small" font-size="16">Trainer 생성 · model/backbone load</text>
  <path d="M283 625 C490 760,695 740,858 253" class="dash"/>
  <path d="M730 603 C790 603,800 500,858 500" class="thin"/>
  <path d="M1021 288 L1021 339" class="thin"/>
  <rect x="858" y="349" width="326" height="132" class="box" fill="#dcc8f6"/>
  <text x="1021" y="383" text-anchor="middle" class="t" font-size="19" font-weight="700">공통 Trainer 계약</text>
  <text x="1021" y="414" text-anchor="middle" class="mono" font-size="16">load() · train() · predict()</text>
  <text x="1021" y="442" text-anchor="middle" class="mono" font-size="16">get_metrics()</text>
  <path d="M1021 481 L1021 531" class="thin"/>
  <rect x="850" y="541" width="342" height="156" class="box" fill="#c4b5fd"/>
  <text x="1021" y="575" text-anchor="middle" class="t" font-size="19" font-weight="700">method별 Trainer 내부</text>
  <text x="1021" y="606" text-anchor="middle" class="small" font-size="15">PatchCore: normal memory 거리</text>
  <text x="1021" y="630" text-anchor="middle" class="small" font-size="15">SimpleNet / RD: feature 기반 점수</text>
  <text x="1021" y="654" text-anchor="middle" class="small" font-size="15">CLIP 계열: image-text similarity</text>
  <text x="1021" y="678" text-anchor="middle" class="small" font-size="15">※ 내부 수식·후처리는 method마다 다름</text>

  <rect x="1261" y="125" width="297" height="610" class="group" fill="#fff7ed"/>
  <text x="1409" y="157" text-anchor="middle" class="h" font-size="20">4. 공통 평가와 저장</text>
  <rect x="1292" y="190" width="235" height="115" class="box" fill="#fed7aa"/>
  <text x="1409" y="227" text-anchor="middle" class="t" font-size="19" font-weight="700">모델 출력 계약</text>
  <text x="1409" y="257" text-anchor="middle" class="small" font-size="16">image anomaly score</text>
  <text x="1409" y="281" text-anchor="middle" class="small" font-size="16">anomaly map</text>
  <path d="M1192 619 C1240 619,1241 248,1292 248" class="thin"/>
  <path d="M1409 305 L1409 359" class="thin"/>
  <rect x="1292" y="369" width="235" height="124" class="box" fill="#ffedd5"/>
  <text x="1409" y="404" text-anchor="middle" class="mono" font-size="18">main_run.py</text>
  <text x="1409" y="434" text-anchor="middle" class="small" font-size="16">label / mask와 비교</text>
  <text x="1409" y="460" text-anchor="middle" class="small" font-size="16">category · seed loop</text>
  <path d="M1409 493 L1409 545" class="thin"/>
  <rect x="1292" y="555" width="235" height="114" class="box" fill="#fdba74"/>
  <text x="1409" y="588" text-anchor="middle" class="t" font-size="18" font-weight="700">검토 가능한 산출물</text>
  <text x="1409" y="617" text-anchor="middle" class="small" font-size="16">Image / Pixel AUROC, F1</text>
  <text x="1409" y="643" text-anchor="middle" class="mono" font-size="16">results_*.csv</text>

  <!-- bottom explanation -->
  <rect x="80" y="795" width="1440" height="150" rx="18" ry="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="115" y="832" class="h" font-size="20">이 그림으로 확인할 핵심</text>
  <text x="115" y="867" class="t" font-size="18">① YAML의 이름이 registry를 통해 Dataset·Trainer class를 고른다. ② Dataset은 어떤 method에도 같은 batch 형식을 제공한다.</text>
  <text x="115" y="899" class="t" font-size="18">③ method별 차이는 Trainer 내부의 score/map 계산이다. ④ main_run은 그 출력과 정답 label·mask를 공통 metric·CSV로 묶는다.</text>
  <rect x="105" y="967" width="22" height="15" fill="#bfe1fa" stroke="#233247"/><text x="135" y="980" class="tag">설정·제어 코드</text>
  <rect x="318" y="967" width="22" height="15" fill="#c7f0d8" stroke="#233247"/><text x="348" y="980" class="tag">공통 Dataset / batch</text>
  <rect x="573" y="967" width="22" height="15" fill="#c4b5fd" stroke="#233247"/><text x="603" y="980" class="tag">method별 Trainer</text>
  <rect x="815" y="967" width="22" height="15" fill="#fed7aa" stroke="#233247"/><text x="845" y="980" class="tag">공통 평가·결과</text>
  <path d="M1098 975 L1152 975" class="thin"/><text x="1164" y="980" class="tag">호출·데이터 전달</text>
</svg>
