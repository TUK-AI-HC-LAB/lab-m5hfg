# 이미지와 정답 mask 크기
resize: 518
imagesize: 518
masksize: 518
batch_size: 1

# 추가 학습 없이 추론하는 QueCo 설정
meta_epochs: 1

# registry에서 uses_backbone=False를 연결한 경우 사용
backbone_names:
  - queco
layers_to_extract_from:
  - layer24

# CLIP과 prompt 설정
depth: 9
n_ctx: 12
t_n_ctx: 4
features_list:
  - 6
  - 12
  - 18
  - 24

# QueCo 내부에서 사용하는 시각 모델
dino_model: dinov2
attn_type: vv
both_eattn_dattn: true

# 비교할 이웃 이미지와 패치 설정
ref_topR: 10
neighbor_chunk: 8
mutual_tau: 0.85
mutual_topk: 5
support_m: 5
agg_percentile_q: 0.85

# 두 브랜치의 결합과 이상 맵 후처리
ablation_mode: all
fusion_mode: entropy
use_text_branch: true
use_objectness_gate: true
obj_tau: 0.5
sigma: 4.0
enable_pose_aux: false

# 결과 그림은 저장하지 않고, 원본의 진단 기록은 유지
save_vis: false
fusion_diagnostics: true

# DINOv3는 사용하지 않지만 원본 모델에서 조회하는 항목
repo_dir: ""
dino_ckpt: ""